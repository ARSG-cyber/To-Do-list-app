<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Daily Planner</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Header -->
    <header class="app-header">
      <div>
        <h1 class="logo-title">My Tasks</h1>
        <p class="logo-subtitle" id="date-display">Today</p>
      </div>
      <div class="header-right">
        <span class="completion-pill" id="task-progress">0 of 0 done</span>
        <button id="theme-btn" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">
          <i class="fa-regular fa-moon"></i>
        </button>
      </div>
    </header>

    <!-- Create Task Form -->
    <section class="task-creator">
      <div class="input-line">
        <input 
          type="text" 
          id="task-input" 
          placeholder="Add a task, hit enter..." 
          autocomplete="off"
        >
        <button id="add-btn" class="btn btn-primary">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>

      <div class="creator-details">
        <div class="select-group">
          <label for="priority-select">Priority</label>
          <select id="priority-select">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>

        <div class="select-group">
          <label for="due-date">Due</label>
          <input type="date" id="due-date">
        </div>

        <div class="select-group">
          <label for="category-select">Category</label>
          <select id="category-select">
            <option value="work" selected>Work</option>
            <option value="personal">Personal</option>
            <option value="learning">Learning</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Filter & Search Toolbar -->
    <section class="toolbar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Search tasks...">
      </div>

      <div class="filters">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="active">Active</button>
        <button class="filter-chip" data-filter="completed">Done</button>
        <button class="filter-chip" data-filter="high-priority">Urgent</button>
      </div>

      <button id="sort-by-priority" class="icon-btn" title="Sort Priority">
        <i class="fa-solid fa-arrow-down-short-wide"></i>
      </button>
    </section>

    <!-- Task List -->
    <main class="list-section">
      <ul id="tasks-list" class="tasks-list">
        <li class="empty-state">
          <i class="fa-solid fa-feather-pointed"></i>
          <p>All caught up! Type above to add a task.</p>
        </li>
      </ul>
    </main>

    <!-- Footer Summary -->
    <footer class="app-footer">
      <button id="clear-completed-btn" class="text-btn">Clear completed</button>
      <button id="export-btn" class="text-btn"><i class="fa-solid fa-download"></i> Export JSON</button>
    </footer>
  </div>

  <!-- Edit Task Modal -->
  <div id="edit-modal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-top">
        <h3>Edit Task</h3>
        <button id="modal-close" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-content">
        <div class="form-item">
          <label for="edit-task-input">Title</label>
          <input type="text" id="edit-task-input">
        </div>
        <div class="form-row">
          <div class="form-item">
            <label for="edit-priority">Priority</label>
            <select id="edit-priority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="form-item">
            <label for="edit-due-date">Due Date</label>
            <input type="date" id="edit-due-date">
          </div>
        </div>
        <div class="form-item">
          <label for="edit-category">Category</label>
          <select id="edit-category">
            <option value="work">Work</option>
            <option value="personal">Personal</option>
            <option value="learning">Learning</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
        <button id="modal-save" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast-box"></div>

  <script src="script.js"></script>
</body>
</html>
